data:
  provider: okx
  base_url: ${OKX_BASE_URL}

scanner:
  poll_seconds: 60
  candle_limit: 200
  symbols:
    - BTC-USDT-SWAP
    - ETH-USDT-SWAP
    - SOL-USDT-SWAP
    - BNB-USDT-SWAP
    - XRP-USDT-SWAP
    - DOGE-USDT-SWAP
    - ADA-USDT-SWAP
    - AVAX-USDT-SWAP
    - LINK-USDT-SWAP
    - DOT-USDT-SWAP
    - TRX-USDT-SWAP
    - POL-USDT-SWAP
    - LTC-USDT-SWAP
    - BCH-USDT-SWAP
    - UNI-USDT-SWAP
    - ATOM-USDT-SWAP
    - ETC-USDT-SWAP
    - FIL-USDT-SWAP
    - APT-USDT-SWAP
    - ARB-USDT-SWAP
    - JTO-USDT-SWAP
    - LDO-USDT-SWAP
    - HYPE-USDT-SWAP
    - VIRTUAL-USDT-SWAP
    - FARTCOIN-USDT-SWAP
    - OP-USDT-SWAP
    - PEPE-USDT-SWAP
    - BONK-USDT-SWAP
    - SHIB-USDT-SWAP
    - WLD-USDT-SWAP
    - HBAR-USDT-SWAP
    - BERA-USDT-SWAP
  timeframes:
    bias:
      - 4H
      - 1H
    entry:
      - 15m
      - 5m

strategy:
  swing_left: 3
  swing_right: 3
  min_rr: 1.5
  max_stop_pct_10x: 1.5
  order_block_lookback: 12
  signal_cooldown_minutes: 180

output:
  log_file: logs/signals.jsonl
  state_file: logs/active_signals.json
  print_no_signal: false
